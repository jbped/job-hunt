name: Release app zip

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run safety tests
        run: python3 server/test_safety.py

      - name: Build app zip
        run: python3 server/package_app.py

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/career-evidence-app.zip \
            --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/career-evidence-app.zip --clobber

      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: career-evidence-app
          path: dist/career-evidence-app.zip
