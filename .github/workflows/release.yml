name: Release app zip

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the UI workspace
        run: npm ci
        working-directory: ui

      - name: Check the UI
        run: npm run typecheck && npm test
        working-directory: ui

      - name: Rebuild the committed bundle
        run: npm run build
        working-directory: ui

      # Users never run Node: server/assets/ui/ is served as committed, so a
      # bundle that no longer matches its source is a broken release.
      - name: Fail on bundle drift
        run: git diff --exit-code server/assets/ui/

      - name: Run safety tests
        run: python3 server/test_safety.py

      - name: Build app zip
        run: python3 server/package_app.py

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/career-evidence-app.zip \
            --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/career-evidence-app.zip --clobber

      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: career-evidence-app
          path: dist/career-evidence-app.zip
