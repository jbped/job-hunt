<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 system-ui, sans-serif; margin: 0; min-width: 320px; }
  main { padding: 12px 14px 14px; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  p { color: #555; margin: 6px 0; }
  label { display: block; margin: 10px 0 2px; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 5px 7px;
    border: 1px solid #ccc; border-radius: 5px; font: inherit; }
  button { margin-top: 12px; padding: 7px 14px; border: 0; border-radius: 6px;
    background: #2557a7; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #status { margin-top: 8px; color: #1a7f37; min-height: 1.3em; }
</style>
</head>
<body>
<main>
  <h1>Pair with the dashboard</h1>
  <p>Open the dashboard, click <b>Pair extension</b>, and paste the token here.
     The token changes every time the dashboard restarts.</p>
  <label for="token">Session token</label>
  <input type="password" id="token" autocomplete="off">
  <label for="port">Dashboard port</label>
  <input type="number" id="port" min="1" max="65535">
  <button id="save">Save</button>
  <div id="status"></div>
</main>
<script src="options.js"></script>
</body>
</html>
